<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc" xml:lang="ru" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" fill="#edf2ff">
<title id="title">Sekvyr: доставка секрета в Kubernetes</title>
<desc id="desc">Доверенный publisher публикует подписанный шифротекст. Оператор сверяет текущую версию с witness дважды, сохраняет checkpoint и обновляет Secret. Перезапуск приложения опционален.</desc>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#83a2ff" stroke-width="1.5" /></marker>
<marker id="gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#f4ca70" stroke-width="1.5" /></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#54e792" stroke-width="1.5" /></marker>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#202635" stroke-width=".6" /></pattern>
</defs>
<rect width="1200" height="1080" rx="20" fill="#0f131c" /><rect width="1200" height="1080" rx="20" fill="url(#grid)" />
<rect x="30" y="26" width="480" height="114" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="54" y="59" font-size="22" font-weight="650">Доверенная публикация</text><text x="54" y="91" fill="#9ab2ff">Шифрование + подпись пакета</text><text x="54" y="120" font-size="16" fill="#a6b1c8">Ключ подписи хранится вне панели</text><text x="710" y="63" font-size="16" fill="#a6b1c8">SEKVYR / KUBERNETES</text><text x="710" y="95" font-size="22" font-weight="650">E2E2: проверка до применения</text><text x="710" y="125" font-size="16" fill="#a6b1c8">Схема для RC, адреса вымышлены</text><rect x="20" y="188" width="500" height="776" rx="20" fill="#121722" stroke="#30394d" stroke-width="1.5" /><text x="44" y="224" font-size="22" font-weight="650">Одна ВМ: панель + witness</text><text x="44" y="254" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#b7c6e8">192.0.2.10 / panel.example</text><rect x="44" y="279" width="452" height="94" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="66" y="312" font-size="22" font-weight="650">Sekvyr / HTTPS :443</text><text x="66" y="346" fill="#9ab2ff">Хранит подписанный шифротекст v42</text><path d="M200 141V182" stroke="#83a2ff" marker-end="url(#blue)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M510 83H568V568H500" stroke="#f4ca70" marker-end="url(#gold)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="540" y="164" fill="#f4ca70">head v42</text><text x="44" y="473" font-size="22" font-weight="650">Тот же хост, отдельная служба</text><text x="44" y="507" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#b7c6e8">witness.example :8443</text><rect x="44" y="535" width="452" height="160" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="66" y="574" font-size="22" font-weight="650">Witness / head v42</text><text x="66" y="608" fill="#f4ca70">Подписывает текущую версию</text><rect x="66" y="634" width="100" height="38" rx="8" fill="#202b3e" /><text x="98" y="660" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#b7c6e8">40</text><text x="171" y="659" font-size="16" fill="#a6b1c8">&gt;</text><rect x="190" y="634" width="100" height="38" rx="8" fill="#202b3e" /><text x="222" y="660" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#b7c6e8">41</text><text x="295" y="659" font-size="16" fill="#a6b1c8">&gt;</text><rect x="314" y="634" width="100" height="38" rx="8" fill="#343020" /><text x="346" y="660" fill="#f4ca70">42</text><path d="M270 697V747" stroke="#f4ca70" marker-end="url(#gold)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="44" y="762" width="452" height="131" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="66" y="801" font-size="22" font-weight="650">Локальный журнал</text><text x="66" y="835" font-size="16" fill="#a6b1c8">Файловая система, без WORM</text><text x="66" y="868" font-size="16" fill="#a6b1c8">Требует доверия к root этой ВМ</text><text x="44" y="935" font-size="16" fill="#a6b1c8">Нет независимой истории вне этой ВМ</text><rect x="710" y="188" width="470" height="776" rx="20" fill="#121722" stroke="#30394d" stroke-width="1.5" /><text x="736" y="224" font-size="22" font-weight="650">Kubernetes</text><text x="736" y="254" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#b7c6e8">198.51.100.20 / namespace: demo</text><rect x="736" y="279" width="418" height="239" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="758" y="316" font-size="22" font-weight="650">sekvyr-operator</text><text x="758" y="351" fill="#f4ca70">1. Head с новым nonce</text><text x="758" y="385" fill="#9ab2ff">2. Пакет по хешу + подпись</text><text x="758" y="419">3. Обертка ключа + расшифровка</text><text x="758" y="453" fill="#f4ca70">4. Повторная проверка head</text><text x="758" y="492" font-size="16" fill="#a6b1c8">Оператор раскрывает ключ в кластере</text><path d="M500 326H704" stroke="#83a2ff" marker-end="url(#blue)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="580" y="303" fill="#9ab2ff">Пакет</text><text x="580" y="355" font-size="16" fill="#a6b1c8">HTTPS / pull</text><path d="M500 612H646V466H728" stroke="#f4ca70" marker-end="url(#gold)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="562" y="640" fill="#f4ca70">Head x2</text><text x="543" y="670" font-size="16" fill="#a6b1c8">один witness</text><path d="M945 519V555" stroke="#54e792" marker-end="url(#green)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="736" y="568" width="418" height="94" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="758" y="605" font-size="22" font-weight="650">Checkpoint / seq 42</text><text x="758" y="639" fill="#54e792">Надежно сохранить ДО записи Secret</text><path d="M945 663V702" stroke="#54e792" marker-end="url(#green)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="736" y="715" width="418" height="85" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="758" y="752" font-size="22" font-weight="650">Kubernetes Secret / runtime-env</text><text x="758" y="782" font-size="16" fill="#a6b1c8">Проверенные значения v42</text><path d="M945 801V841" stroke="#54e792" marker-end="url(#green)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="736" y="854" width="418" height="85" rx="16" fill="#1a2130" stroke="#3b4861" stroke-width="1.5" /><text x="758" y="890" font-size="22" font-weight="650">Под приложения / ENV v42</text><text x="758" y="921" fill="#54e792">Rollout по изменению, опционально</text><text x="32" y="1009">Пакет не прошел проверку или панель недоступна ? Последний корректный Secret сохраняется.</text><path d="M36 1044H83" stroke="#83a2ff" marker-end="url(#blue)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="1051" font-size="16" fill="#a6b1c8">Шифротекст</text><path d="M350 1044H397" stroke="#f4ca70" marker-end="url(#gold)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="412" y="1051" font-size="16" fill="#a6b1c8">Подтверждение версии</text><path d="M756 1044H803" stroke="#54e792" marker-end="url(#green)" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="818" y="1051" font-size="16" fill="#a6b1c8">Запись внутри кластера</text></svg>