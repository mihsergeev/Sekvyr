# Заголовки ниже, на уровне server, должны доходить до КАЖДОГО ответа. По
# умолчанию nginx их отбрасывает в любом location, где есть свой add_header:
# так главная страница панели (location / с Cache-Control) жила без CSP, без
# запрета фрейма и без HSTS, а заголовки получали только ответы /api/. merge
# складывает заголовки location с заголовками уровнем выше (nginx 1.29.3+).
add_header_inherit merge;

server {
    # 8080, а не 80: контейнер работает без root и порты ниже 1024 занять не может
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    # Панель не должна попадать в поисковую выдачу ни при каких обстоятельствах.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Заголовки безопасности. CSP: скрипты только со своего origin, никаких
    # inline; data: - для встроенных иконок; unsafe-inline в style - для стилей
    # React. connect-src 'self' означает, что даже подмененный скрипт не сможет
    # отправить прочитанное значение на чужой адрес.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS игнорируется по HTTP и применяется, когда впереди HTTPS-прокси
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        # Адрес бэкенда берем ПЕРЕМЕННОЙ, а не литералом. С литералом nginx
        # резолвит имя один раз при старте и держит адрес вечно; docker при
        # пересоздании контейнера выдает новый - и панель отдает 502 при живом
        # бэкенде. Переменная заставляет ходить в DNS docker с коротким кэшем.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sekvyr_backend http://backend:8000;
        proxy_pass $sekvyr_backend$request_uri;
        client_max_body_size 2m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Имена файлов в assets содержат хеш содержимого: меняется содержимое -
    # меняется имя, поэтому их можно кешировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Флаги стран: файлы неизменные и мелкие, а на странице их бывает десяток.
    # Без этого каждый заход тянул бы их заново - location ниже запрещает кеш.
    location /flags/ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location / {
        # А вот index.html кешировать нельзя: он ссылается на конкретные имена
        # бандлов, и закешированный держит человека на прошлой версии панели.
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
