# The cluster gets its secrets through External Secrets Operator.
#
# For those who already run ESO: no operator of our own is needed, the panel
# answers a plain request. The price is a static "client id + secret" pair in a
# cluster Secret: ESO makes a single request and cannot exchange the secret for
# a short-lived token first.
#
# Where you can, prefer agent-sidecar.yaml: there the pod proves itself with its
# ServiceAccount token, and nothing has to be stored in the cluster.
#
# In the panel: Servers -> menu "..." -> "Machine without an agent", then grant
# it the environment in the Access section.
#
# Checked with External Secrets Operator 2.11 and 2.12.
---
apiVersion: v1
kind: Secret
metadata:
  name: sekvyr-credentials
  namespace: billing
  labels:
    # ESO lets the webhook provider read only Secrets marked for it.
    external-secrets.io/type: webhook
type: Opaque
stringData:
  # The pair the panel showed once when the machine was created.
  client_id: "skv-0123456789abcdef"
  client_secret: "replace-me"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sekvyr
  namespace: billing
spec:
  provider:
    webhook:
      # The machine API: open to the world, nothing in it writes values.
      url: "https://sekvyr.example.com/api/v1/machine/secrets?group=acme&project=billing&env=prod"
      method: GET
      headers:
        Authorization: 'Basic {{ print .auth.client_id ":" .auth.client_secret | b64enc }}'
      result:
        # The value of the requested key from the panel answer. The string in
        # the filter takes double quotes: single ones do not parse in ESO.
        jsonPath: '$.values[?(@.name == "{{ .remoteRef.key }}")].value'
      secrets:
        # Every key of the Secret becomes .auth.<key> in the templates above.
        - name: auth
          secretRef:
            name: sekvyr-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-app
  namespace: billing
spec:
  # How often ESO asks the panel. The audit log records a new set of values,
  # a new address and once a day; repeated reads in between are counted.
  refreshInterval: 1m
  secretStoreRef:
    name: sekvyr
    kind: SecretStore
  target:
    name: billing-app-env
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: JWT_SECRET
