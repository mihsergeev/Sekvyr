# Оверлей для установок с caddy-docker-proxy: TLS на границе и белый список
# адресов. Нужна уже существующая внешняя docker-сеть (по умолчанию "caddy"),
# за которой следит работающий caddy-docker-proxy. Сеть заводите с IPv6:
#
#   docker network create --ipv6 caddy
#
# Без него соединения по IPv6 Docker пропускает через свой прокси, caddy видит
# вместо клиента адрес шлюза, и белый список таких клиентов не пускает. Так
# заводит сеть ops/quickstart.sh.
#
#   docker compose -f compose.yml -f compose.caddy.yml up -d --build
#
# или COMPOSE_FILE=compose.yml:compose.caddy.yml в .env.
#
# Задайте SEKVYR_DOMAIN и SEKVYR_ALLOW_IPS. Здесь же живет главное свойство
# развертывания Sekvyr: админка доступна только из белого списка, а машинный
# контур открыт всем - но это два РАЗНЫХ блока, и перепутать их нельзя.
services:
  frontend:
    # caddy ходит во внутреннюю сеть - порт на хосте не нужен, сбрасываем
    # опубликованный базовым compose (иначе конфликт портов).
    ports: !reset []
    networks:
      - internal
      - caddy
    labels:
      caddy: ${SEKVYR_DOMAIN}
      # 1) Машинный контур - открыт с любого адреса. Серверы и кластеры забирают
      #    секреты из сетей, которых нет и не может быть в белом списке админов;
      #    аутентификация там своя (машинная личность), а значения этот контур
      #    только читает: что-то меняют четыре его маршрута, и ни один не
      #    касается значений (список держит ops/selfcheck.py).
      caddy.handle_0: /api/v1/machine/*
      caddy.handle_0.reverse_proxy: "{{upstreams 8080}}"
      # 2) Все остальное - панель. Доступна только адресам из SEKVYR_ALLOW_IPS.
      #    ВНИМАНИЕ: пустой список означает "не в списке всех адресов", то есть
      #    не запрещает никому - панель окажется открыта миру, и защитой останется
      #    только пароль. Для хранилища секретов это не то состояние, в котором
      #    стоит жить: задайте свои адреса или держите панель за VPN.
      #    Подсеть Docker (172.16.0.0/12) здесь НЕ пускается. Если у сети caddy
      #    нет IPv6, через собственный прокси Docker приходят все клиенты по
      #    IPv6, и caddy видит у них адрес шлюза моста: пустить эту подсеть
      #    значило бы пустить в админку любого, кто зайдет на сервер по IPv6.
      #    Сторож, бэкапы и обновление идут мимо caddy: бэкап и обновление через
      #    docker compose exec, сторож читает файл пульса. Открыть админку с
      #    самого сервера - ssh-туннелем прямо в контейнер фронтенда.
      #    Сознательно НЕ caddy'шный private_ranges: он включает 10/8 и
      #    192.168/16, а это в корпоративной сети значит "пускаем всех соседей".
      caddy.handle_1.@denied.not.remote_ip: 127.0.0.1/32 ::1/128 ${SEKVYR_ALLOW_IPS:-0.0.0.0/0 ::/0}
      caddy.handle_1.abort: "@denied"
      caddy.handle_1.reverse_proxy: "{{upstreams 8080}}"

networks:
  caddy:
    external: true
    # Имя существующей сети, за которой следит ваш caddy-docker-proxy.
    name: ${SEKVYR_CADDY_NETWORK:-caddy}
