name: Release

# По тегу vX.Y.Z собирает и публикует в GHCR образы панели (backend, frontend)
# и образ агента для Kubernetes. Сначала проверка: тег стоит на коммите из main,
# версия в коде та же, самопроверка чистая, подпись агента сходится с
# agent/pubkey.txt, а агент, собранный так же, как в образе панели, - с
# подписанным agent/manifest.json. Образ, который отвечал бы 500 вместо агента,
# выпускать нельзя.
#
# Права токена выдаются заданиям по отдельности: проверка только читает, а
# писать в реестр может только публикация и только после проверки.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история: по ней видно, есть ли коммит тега в main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Тег можно поставить на коммит, которого нет в main: с ветки, которую не
      # смотрели и где CI не проходил. Выпуском он стал бы образом для всех.
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main" >&2
            exit 1
          fi

      # Тег и версия в коде должны совпадать: иначе образ v1.2.0 показывал бы в
      # "О панели" 1.1.0, и по журналу обновления не понять, что стоит на деле.
      - name: Tag matches the code version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend=$(grep -m1 '^version = ' backend/pyproject.toml | cut -d'"' -f2)
          frontend=$(grep -m1 '"version":' frontend/package.json | cut -d'"' -f4)
          base="${tag%%-*}"
          if [ "$backend" != "$base" ] || [ "$frontend" != "$base" ]; then
            echo "tag $GITHUB_REF_NAME, backend $backend, frontend $frontend" >&2
            exit 1
          fi

      - name: Selfcheck
        run: |
          pip install cryptography
          python ops/selfcheck.py

      - name: Agent signature
        run: python ops/agent_release.py --verify

      - name: Agent build matches the signature
        run: |
          docker build --target agent -f backend/Dockerfile -t sekvyr-agent-build .
          id=$(docker create sekvyr-agent-build sh)
          docker cp "$id:/out" agent-out
          docker rm "$id"
          python ops/agent_release.py --compare agent-out

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest переезжает только на выпуск vX.Y.Z. Предрелиз (v1.1.0-rc1) с ним
      # стал бы образом по умолчанию для всех, кто ставит панель без версии.
      - name: Owner and versions
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "agent=$(cat agent/VERSION)" >> "$GITHUB_OUTPUT"
          if echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      # VERSION и REVISION уходят в метки образа (org.opencontainers.image.*):
      # по ним видно, из какого выпуска и коммита образ.
      - name: Backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sekvyr-backend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.final == 'true' && format('ghcr.io/{0}/sekvyr-backend:latest', steps.meta.outputs.owner) || '' }}

      - name: Frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sekvyr-frontend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.final == 'true' && format('ghcr.io/{0}/sekvyr-frontend:latest', steps.meta.outputs.owner) || '' }}

      # Агент собирается кросс-компиляцией на платформе сборщика, эмуляция
      # для arm64 не нужна: в последнем слое только копирование бинаря.
      - name: Agent image for Kubernetes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.agent }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sekvyr-agent:${{ steps.meta.outputs.agent }}
            ${{ steps.meta.outputs.final == 'true' && format('ghcr.io/{0}/sekvyr-agent:latest', steps.meta.outputs.owner) || '' }}
