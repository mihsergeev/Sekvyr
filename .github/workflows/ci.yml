name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        # Зависимости панели - те же версии и хеши, что в образе (constraints.txt,
        # целиком, как в Dockerfile). Инструменты тестов в образ не попадают, их
        # хешей там нет, поэтому они ставятся вторым шагом.
        run: |
          pip install --require-hashes -r constraints.txt
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(p['optional-dependencies']['dev']))" > /tmp/dev.txt
          pip install -r /tmp/dev.txt
          pip check
      - name: Tests
        run: pytest -q
      - name: Dependency audit (pip-audit)
        continue-on-error: true # информативно, не блокирует
        run: |
          pip install pip-audit==2.10.1
          pip-audit

  # Списки, написанные руками (уровни ролей на двух сторонах, подписи действий
  # журнала, имена переменных окружения), не ломаются с ошибкой - они молча
  # расходятся. Ловим машинно.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Consistency selfcheck
        # cryptography - для сверки подписи агента; без нее самопроверка
        # падала на первом импорте, и ни одна из проверок не выполнялась.
        run: |
          pip install cryptography
          python ops/selfcheck.py
      - name: Shell scripts parse
        # Скрипты исполняет sh (dash на Debian и Ubuntu), а не bash: ошибка
        # разбора в редкой ветке иначе всплывала бы у человека посреди
        # обновления или восстановления.
        run: |
          for f in ops/*.sh agent/install.sh backend/docker-entrypoint.sh; do
            sh -n "$f" || { echo "$f: syntax error"; exit 1; }
          done

  # Права проверяются дважды: статически (selfcheck выше - ни один маршрут не
  # обходит проверку) и на живой панели. Второе ловит то, чего не видно в коде:
  # недопримененную миграцию, разъехавшуюся политику по умолчанию, маршрут,
  # который отвечает не тем, чем должен.
  #
  # Дважды: на SQLite и на Postgres. Прод работает на Postgres, и то, что SQLite
  # прощает (типы, нулевой символ, длина строки, порядок миграций), видно
  # только там.
  live-rights-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - sqlite+aiosqlite:///./data/ci.db
          - postgresql+asyncpg://sekvyr:ci-db-password@127.0.0.1:5432/sekvyr
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sekvyr
          POSTGRES_PASSWORD: ci-db-password
          POSTGRES_DB: sekvyr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sekvyr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SEKVYR_DB_URL: ${{ matrix.db }}
      SEKVYR_ADMIN_USER: admin
      SEKVYR_ADMIN_PASSWORD: ci-password-2026-long
      SEKVYR_JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        # Зависимости по хешам, сам пакет отдельно и без зависимостей: alembic
        # импортирует app, а хешей у пакета из каталога нет.
        run: |
          pip install --require-hashes -r backend/constraints.txt
          pip install --no-deps ./backend
      - name: Migrate and start the panel
        working-directory: backend
        run: |
          mkdir -p data
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          # Цикл кончается и без ответа панели: тогда шаг должен упасть здесь,
          # с журналом запуска, а не дальше непонятной ошибкой подключения.
          curl -sf http://127.0.0.1:8000/api/health >/dev/null || { cat uvicorn.log; exit 1; }
      - name: Create the vault
        run: python ops/ci_bootstrap.py --password "$SEKVYR_ADMIN_PASSWORD"
      - name: Live rights audit
        run: python ops/audit_live.py --url http://127.0.0.1:8000 --owner admin --password "$SEKVYR_ADMIN_PASSWORD"

  # Агент работает на серверах от root и обновляет себя сам, поэтому его
  # проверяют отдельно. Последний шаг собирает его так же, как образ панели, и
  # сверяет с подписанным manifest.json: панель отдает бинарь, только если хеш
  # сошелся, а иначе отвечает 500, и подключение серверов ломается.
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: gofmt
        working-directory: agent
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        working-directory: agent
        run: go vet ./...
      - name: go test
        working-directory: agent
        run: go test ./...
      # Установщик выполняется от root, и у него три пути: чистая нода,
      # подключенная нода (бинарь меняет стоящий агент) и --reenroll. Ошибка в
      # одном из них видна только на чужом сервере.
      - name: install.sh
        run: sh agent/install_test.sh
      - name: Build as the panel image does and compare with the signature
        run: |
          docker build --target agent -f backend/Dockerfile -t sekvyr-agent-build .
          id=$(docker create sekvyr-agent-build sh)
          docker cp "$id:/out" agent-out
          docker rm "$id"
          pip install cryptography
          python ops/agent_release.py --compare agent-out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        # Верстку и поведение страниц раньше проверяли только руками в браузере.
        # Тесты появились, но без этой строки их запускал бы один человек и
        # только когда вспомнит.
        run: npm test
      - name: Dependency audit (npm audit)
        continue-on-error: true # информативно, не блокирует
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Контекст бэкенда - КОРЕНЬ репозитория: его Dockerfile копирует backend/
      # и agent/ из него.
      - name: Build images
        run: |
          docker build -f backend/Dockerfile -t sekvyr-backend .
          docker build -t sekvyr-frontend frontend
          docker build -t sekvyr-agent agent
      # Код панели принадлежит root, лежит в образе одной копией и процессу
      # панели только на чтение; pip и его кэша в образе нет. Метки у всех
      # трех образов свои, а не унаследованные от базового.
      - name: Image contents and labels
        run: |
          docker run --rm --entrypoint sh sekvyr-backend -c '
            set -eu
            test "$(stat -c %u /srv /srv/app /srv/app/main.py /srv/alembic | sort -u)" = 0
            ! gosu sekvyr test -w /srv/app || exit 1
            ! gosu sekvyr test -w /srv/app/main.py || exit 1
            test "$(cd / && python -c "import app; print(app.__file__)")" = /srv/app/__init__.py
            ! ls -d /usr/local/lib/python3.12/site-packages/app /usr/local/lib/python3.12/site-packages/sekvyr_backend* 2>/dev/null || exit 1
            test ! -e /root/.cache
            ! python -m pip --version 2>/dev/null || exit 1
          ' || { echo "backend image: code ownership, a second copy of app or pip"; exit 1; }
          for image in sekvyr-backend sekvyr-frontend sekvyr-agent; do
            labels=$(docker image inspect -f '{{json .Config.Labels}}' "$image")
            echo "$image: $labels"
            for key in title description source version licenses; do
              echo "$labels" | jq -e --arg k "org.opencontainers.image.$key" '.[$k] // "" | length > 0' >/dev/null \
                || { echo "$image: no org.opencontainers.image.$key"; exit 1; }
            done
            if echo "$labels" | grep -qi nginx; then
              echo "$image: labels of the base image"; exit 1
            fi
          done
      # Отчет по уязвимостям в образах, не блокирует: находка в базовом образе
      # не повод держать правку, которая к нему отношения не имеет. Падает на
      # находках еженедельный audit.yml, по опубликованным образам.
      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sekvyr-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (frontend image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sekvyr-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (agent image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sekvyr-agent
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Заголовки безопасности нужны самой странице панели, а не только /api/:
      # nginx молча отбрасывает их в location со своим add_header, и главная
      # страница так однажды жила без CSP и без запрета фрейма.
      - name: Security headers on the panel pages
        run: |
          docker run -d --name fe -p 127.0.0.1:8080:8080 sekvyr-frontend
          sleep 2
          for path in / /p/acme/api/prod /assets/missing.js; do
            headers=$(curl -s -o /dev/null -D - "http://127.0.0.1:8080$path")
            for h in content-security-policy x-frame-options x-content-type-options strict-transport-security x-robots-tag; do
              echo "$headers" | grep -qi "^$h:" || { echo "$path: no $h"; exit 1; }
            done
          done

  # compose.yml целиком, как на сервере, только без caddy: права контейнеров,
  # сети, проверки здоровья, ключ в /secret и бэкап через ops/backup.sh. Ошибку
  # в этом иначе увидел бы человек на своей VPS посреди обновления.
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      SEKVYR_ADMIN_PASSWORD: ci-password-2026-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test .env
        run: |
          cat > .env <<EOF
          SEKVYR_ADMIN_USER=admin
          SEKVYR_ADMIN_PASSWORD=$SEKVYR_ADMIN_PASSWORD
          SEKVYR_JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef
          SEKVYR_DB_PASSWORD=ci-db-password
          SEKVYR_ROOT_KEY_FILE=/secret/root.key
          SEKVYR_BIND=127.0.0.1:8080
          EOF
          # Нужен только httpx, но в режиме хешей pip берет список целиком.
          pip install --require-hashes -r backend/constraints.txt
      # ./data и ./secret заранее не создаются: их заводит docker от root, и
      # entrypoint должен сам отдать их панели, оставив себе только нужные права.
      - name: Up
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Rights, read-only and networks
        run: |
          set -eu
          be=$(docker compose ps -q backend)
          fe=$(docker compose ps -q frontend)
          db=$(docker compose ps -q db)
          uid() { docker compose exec -T "$1" awk '/^Uid:/ {print $2}' /proc/1/status; }
          caps() { docker compose exec -T "$1" awk '/^'"$2"':/ {print $2}' /proc/1/status; }
          # Панель работает от uid 10001 без прав; у контейнера остались
          # CHOWN, DAC_OVERRIDE, FOWNER, SETGID и SETUID (0xcb), у nginx - ничего.
          test "$(uid backend)" = 10001
          test "$(caps backend CapEff)" = 0000000000000000
          test "$(caps backend CapBnd)" = 00000000000000cb
          test "$(uid frontend)" = 101
          test "$(caps frontend CapBnd)" = 0000000000000000
          for c in "$be" "$fe"; do
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$c")" = true
          done
          ! docker compose exec -T backend touch /srv/app/x 2>/dev/null || exit 1
          docker compose exec -T backend touch /tmp/x
          # База только в сети без выхода наружу, фронтенд в нее не входит, а
          # бэкенд наружу ходит (оповещения, копия журнала).
          for net in $(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$db"); do
            test "$(docker network inspect -f '{{.Internal}}' "$net")" = true
            ! docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$fe" | grep -qw "$net" || exit 1
          done
          routes=$(docker compose exec -T db ip route)
          ! printf '%s\n' "$routes" | grep -q '^default' || exit 1
          docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('https://github.com', timeout=15)"
          docker compose exec -T frontend wget -q -O /dev/null http://127.0.0.1:8080/api/health
      - name: Vault, the key in /secret and a restart
        run: |
          set -eu
          python ops/ci_bootstrap.py --url http://127.0.0.1:8080 --password "$SEKVYR_ADMIN_PASSWORD"
          python - <<'EOF'
          import os, httpx
          c = httpx.Client(base_url="http://127.0.0.1:8080", timeout=30)
          token = c.post("/api/auth/login", json={"username": "admin", "password": os.environ["SEKVYR_ADMIN_PASSWORD"]}).json()["access_token"]
          c.post("/api/vault/remember-key", headers={"Authorization": f"Bearer {token}"}).raise_for_status()
          EOF
          test "$(sudo stat -c '%u %a' secret secret/root.key)" = "10001 700
          10001 600"
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 120
          curl -sf http://127.0.0.1:8080/api/health | python -c "import json, sys; assert json.load(sys.stdin)['sealed'] is False"
      - name: Live rights audit
        run: python ops/audit_live.py --url http://127.0.0.1:8080 --owner admin --password "$SEKVYR_ADMIN_PASSWORD"
      # Бэкап шифрует разовый контейнер от root, и пароль 0600 с владельцем
      # 10001 он читает благодаря DAC_OVERRIDE. Распечатка - как в ops/restore.sh.
      - name: Backup and unseal
        run: |
          set -eu
          sudo SEKVYR_APP="$PWD" sh ops/backup.sh > /dev/null
          sudo grep -q '"ok": true' data/backup.json
          file=$(ls backups/*.sql.sealed | tail -n 1)
          { sudo cat secret/backup.pass; echo; sudo cat "$file"; } \
            | docker compose run --rm --no-deps -T --entrypoint python backend -c "
          import sys
          from app import sealedfile
          password = sys.stdin.buffer.readline().decode().strip()
          sealedfile.unseal(sys.stdin.buffer, sys.stdout.buffer, password=password)
          " | grep -q "CREATE TABLE"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Down
        if: always()
        run: docker compose down
