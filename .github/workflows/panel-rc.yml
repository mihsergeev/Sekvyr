name: Build and promote reviewed panel RC

on:
  push:
    branches: ["rc/panel-v*"]
  workflow_dispatch:
    inputs:
      candidate_run:
        required: true
        type: string

permissions: {}

jobs:
  candidate:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            architecture: amd64
            runner: ubuntu-latest
            context: .
            dockerfile: backend/Dockerfile
          - component: backend
            architecture: arm64
            runner: ubuntu-24.04-arm
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            architecture: amd64
            runner: ubuntu-latest
            context: frontend
            dockerfile: frontend/Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate OCI archive
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#rc/panel-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          test "$version" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml)"
          test "$version" = "$(jq -r .version frontend/package.json)"
          docker buildx build --platform "linux/$ARCH" --file "$DOCKERFILE" \
            --build-arg "VERSION=$version" --build-arg "REVISION=$GITHUB_SHA" \
            --provenance=false --sbom=false --output type=oci,dest=candidate.oci.tar "$CONTEXT"
          mkdir candidate-oci
          tar -xf candidate.oci.tar -C candidate-oci
      - name: Scan the exact OCI archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: candidate-oci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          version: v0.76.1
          ignore-unfixed: false
          exit-code: "1"
      - name: Inventory the scanned archive
        run: |
          trivy image --input candidate-oci --format cyclonedx --output sbom.cdx.json
          sha256sum candidate.oci.tar sbom.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.component }}-${{ matrix.architecture }}
          path: |
            candidate.oci.tar
            sbom.cdx.json
            SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: panel-rc-promotion
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify candidate and CI against this commit
        id: candidate
        run: |
          set -euo pipefail
          version="$(jq -r .version frontend/package.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin "refs/tags/v$version"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          branch="rc/panel-v$version"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" | jq -e \
            --arg sha "$GITHUB_SHA" --arg branch "$branch" \
            '.path == ".github/workflows/panel-rc.yml" and .conclusion == "success" and
             .event == "push" and .head_branch == $branch and .head_sha == $sha'
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch="$branch" -f event=push -f status=success \
            --jq '.workflow_runs | length' | awk '$1 > 0 { ok=1 } END { exit !ok }'
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download and validate the scanned builds
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$CANDIDATE_RUN" --dir "$RUNNER_TEMP/candidate" \
            --pattern 'backend-*' --pattern 'frontend-*'
          python ops/panel_rc.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/panel" "$VERSION" "$GITHUB_SHA"
      - name: Verify both targets and stage by digest
        id: stage
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y skopeo)
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          cd "$RUNNER_TEMP/panel"
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/sekvyr-$component"
            raw=$(skopeo inspect --raw "oci-archive:$component-image.oci.tar" | sha256sum | cut -d' ' -f1)
            if skopeo inspect --raw "docker://$image:$VERSION" > existing.json 2> inspect.err; then
              test "$(sha256sum existing.json | cut -d' ' -f1)" = "$raw"
            else
              grep -Eqi 'manifest unknown|name unknown' inspect.err || (cat inspect.err >&2; exit 1)
            fi
            echo "$component=$image" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=sha256:$raw" >> "$GITHUB_OUTPUT"
            printf '%s\n' "sha256:$raw" > "$component.digest"
          done
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/sekvyr-$component"
            digest=$(cat "$component.digest")
            skopeo copy --all --preserve-digests --retry-times 3 \
              "oci-archive:$component-image.oci.tar" "docker://$image@$digest"
            test "sha256:$(skopeo inspect --raw "docker://$image@$digest" | sha256sum | cut -d' ' -f1)" = "$digest"
          done
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.stage.outputs.backend }}
          subject-digest: ${{ steps.stage.outputs.backend_digest }}
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.stage.outputs.frontend }}
          subject-digest: ${{ steps.stage.outputs.frontend_digest }}
      - name: Set and verify the RC tags
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/panel"
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/sekvyr-$component"
            digest=$(cat "$component.digest")
            skopeo copy --all --preserve-digests --retry-times 3 "docker://$image@$digest" "docker://$image:$VERSION"
          done
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/sekvyr-$component"
            test "sha256:$(skopeo inspect --raw "docker://$image:$VERSION" | sha256sum | cut -d' ' -f1)" = "$(cat "$component.digest")"
          done
