name: Build and promote reviewed RC images

on:
  push:
    branches: ["rc/panel-v*"]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [prepare, promote]
        required: true
      candidate_run:
        description: Candidate workflow run ID (prepare)
        type: string
      candidate_attempt:
        description: Candidate run attempt (prepare)
        type: string
      release_id:
        description: Reviewed draft or immutable release ID (promote)
        type: string
      manifest_sha256:
        description: SHA-256 of the reviewed manifest (promote)
        type: string

permissions: {}

jobs:
  candidate:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            architecture: amd64
            runner: ubuntu-latest
            context: .
            dockerfile: backend/Dockerfile
          - component: backend
            architecture: arm64
            runner: ubuntu-24.04-arm
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            architecture: amd64
            runner: ubuntu-latest
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: operator
            architecture: amd64
            runner: ubuntu-latest
            context: operator
            dockerfile: operator/Dockerfile
          - component: operator
            architecture: arm64
            runner: ubuntu-24.04-arm
            context: operator
            dockerfile: operator/Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate OCI archive
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.architecture }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#rc/panel-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          test "$version" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml)"
          test "$version" = "$(jq -r .version frontend/package.json)"
          if [[ "$COMPONENT" = operator ]]; then
            version="$(cat operator/VERSION)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
            docker buildx build --platform "linux/$ARCH" --file "$DOCKERFILE" \
              --target provision-artifacts --output type=local,dest=provision "$CONTEXT"
            test "$(./provision/sekvyr-provision version)" = "$version"
            cp provision/sekvyr-provision sekvyr-provision
          fi
          docker buildx build --platform "linux/$ARCH" --file "$DOCKERFILE" \
            --build-arg "VERSION=$version" --build-arg "REVISION=$GITHUB_SHA" \
            --provenance=false --sbom=false --output type=oci,compression=gzip,dest=candidate.oci.tar "$CONTEXT"
          mkdir candidate-oci
          tar -xf candidate.oci.tar -C candidate-oci
      - name: Scan the exact OCI archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: candidate-oci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          version: v0.76.1
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan the exact offline provision binary
        if: matrix.component == 'operator'
        run: trivy rootfs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 provision
      - name: Inventory the scanned archive
        run: |
          trivy image --input candidate-oci --format cyclonedx --output sbom.cdx.json
          sha256sum candidate.oci.tar sbom.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.component }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: |
            candidate.oci.tar
            sbom.cdx.json
            SHA256SUMS
            ${{ matrix.component == 'operator' && 'sekvyr-provision' || '' }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'prepare' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/sekvyr-operator-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install verified Helm for the operator chart
        if: startsWith(github.ref, 'refs/tags/sekvyr-operator-v')
        run: |
          cd "$RUNNER_TEMP"
          archive=helm-v4.3.1-linux-amd64.tar.gz
          curl -fsSLO --retry 2 "https://get.helm.sh/$archive"
          curl -fsSLO --retry 2 "https://get.helm.sh/$archive.sha256sum"
          sha256sum -c "$archive.sha256sum"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Pin the candidate attempt and assemble the release assets
        run: |
          python -m ops.panel_rc_release prepare "$RUNNER_TEMP/panel" \
            --candidate-run="$CANDIDATE_RUN" --candidate-attempt="$CANDIDATE_ATTEMPT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: manifest
        with:
          subject-path: ${{ runner.temp }}/panel/release-manifest.json
      - name: Keep the verification bundle with the assets
        env:
          BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/panel/release-manifest.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-release-assets-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/panel/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'promote' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/sekvyr-operator-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: panel-rc-promotion-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      # Reading draft releases by ID requires access to unpublished contents.
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the reviewed assets from the durable release
        run: |
          python -m ops.panel_rc_release reviewed "$RUNNER_TEMP/panel" \
            --release-id="$RELEASE_ID" --manifest-sha256="$MANIFEST_SHA256"
      - name: Validate and stage the exact images by digest
        id: stage
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || (sudo apt-get update && sudo apt-get install -y skopeo)
          cd "$RUNNER_TEMP/panel"
          mapfile -t components < <(jq -er '.images | keys[]' release-manifest.json)
          for component in "${components[@]}"; do
            ref=$(jq -er --arg component "$component" '.images[$component]' release-manifest.json)
            digest=${ref##*@}
            raw=$(skopeo inspect --raw "oci-archive:$component-image.oci.tar" | sha256sum | cut -d' ' -f1)
            test "sha256:$raw" = "$digest"
            echo "$component=${ref%@*}" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          for component in "${components[@]}"; do
            ref=$(jq -er --arg component "$component" '.images[$component]' release-manifest.json)
            skopeo copy --all --preserve-digests --retry-times 3 \
              "oci-archive:$component-image.oci.tar" "docker://$ref"
          done
          for component in "${components[@]}"; do
            ref=$(jq -er --arg component "$component" '.images[$component]' release-manifest.json)
            raw=$(skopeo inspect --raw "docker://$ref" | sha256sum | cut -d' ' -f1)
            test "sha256:$raw" = "${ref##*@}"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.stage.outputs.backend }}
          subject-digest: ${{ steps.stage.outputs.backend_digest }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.stage.outputs.frontend }}
          subject-digest: ${{ steps.stage.outputs.frontend_digest }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/sekvyr-operator-v')
        with:
          subject-name: ${{ steps.stage.outputs.operator }}
          subject-digest: ${{ steps.stage.outputs.operator_digest }}
      - name: Identify the reviewed images for publication
        run: |
          {
            printf 'Reviewed release ID %s\n\n' "$RELEASE_ID"
            printf 'SHA-256 of release-manifest.json\n\n'
            sha256sum "$RUNNER_TEMP/panel/release-manifest.json" | cut -d' ' -f1
          } >> "$GITHUB_STEP_SUMMARY"
