[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sekvyr-backend"
version = "1.0.0"
description = "Sekvyr — self-hosted secrets & env panel (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "PyJWT>=2.15.1",
    # Панель шифрует значения (M1) и проверяет подписи - версия зафиксирована
    # снизу осознанно: 50.0 - первая без PYSEC-2026-3552.
    "cryptography>=50.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
