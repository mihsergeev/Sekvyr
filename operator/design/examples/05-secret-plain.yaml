# Replace the fictional UID with the UID of plain-application-secrets.
apiVersion: secrets.sekvyr.ru/v1alpha1
kind: SekvyrSecret
metadata:
  name: checkout-runtime
  namespace: apps
spec:
  storeRef:
    name: plain-application-secrets
    uid: 44444444-4444-4444-8444-444444444444
  binding: checkout-prod
  refreshIntervalSeconds: 60
