# Alternative to 02-secret-e2e.yaml, not an additional Secret.
# Requires the installation RBAC and administrative Store allowlist.
apiVersion: secrets.sekvyr.ru/v1alpha1
kind: SekvyrSecret
metadata:
  name: billing-runtime
  namespace: apps
spec:
  storeRef:
    name: application-secrets
    uid: 11111111-1111-4111-8111-111111111111
  binding: billing-prod
  refreshIntervalSeconds: 60
  rollout:
    enabled: true
    deployments:
      - billing-api
