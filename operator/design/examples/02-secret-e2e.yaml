# Replace storeRef.uid with the actual Store UID; the value below is fictional.
apiVersion: secrets.sekvyr.ru/v1alpha1
kind: SekvyrSecret
metadata:
  name: billing-runtime
  namespace: apps
spec:
  storeRef:
    name: application-secrets
    uid: 11111111-1111-4111-8111-111111111111
  binding: billing-prod
  refreshIntervalSeconds: 60
  suspend: false
  rollout:
    enabled: false
    deployments: []
