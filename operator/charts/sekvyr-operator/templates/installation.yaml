apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sekvyr-operator.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sekvyr-operator.labels" . | nindent 4 }}
  {{- if .Values.configuration.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
immutable: true
data:
  installation.json: {{ include "sekvyr-operator.installation" . | quote }}
